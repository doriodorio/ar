<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>AR Building Defense</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      // Special component to draw only the outer edges (no diagonals)
      AFRAME.registerComponent('draw-edges', {
        init: function () {
          this.el.addEventListener('loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (mesh) {
              const edges = new THREE.EdgesGeometry(mesh.geometry);
              const material = new THREE.LineBasicMaterial({ color: 0x000000 });
              const lineSegments = new THREE.LineSegments(edges, material);
              mesh.add(lineSegments);
            }
          });
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #ui-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
      #stats-bar { display: flex; justify-content: space-between; padding: 20px; color: white; text-shadow: 2px 2px 4px black; }
      .stat-box { background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 8px; border: 2px solid #0ff; font-weight: bold; font-size: 1.2rem;}
      #version-display { position: absolute; top: 10px; right: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px; font-size: 0.8rem; z-index: 100; }
      
      .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; pointer-events: auto; }
      .hidden { display: none !important; }
      button { padding: 15px 40px; font-size: 1.5rem; background: #0ff; border: none; border-radius: 30px; cursor: pointer; margin-top: 15px; font-weight: bold; }
    </style>
  </head>
  <body>

    <div id="version-display">Version: 1.2.6</div>

    <div id="ui-container" class="hidden">
      <div id="stats-bar">
        <div class="stat-box">Score: <span id="score-val">0</span></div>
        <div class="stat-box">Health: <span id="health-val">100</span>%</div>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
      <h1>DEFEND THE BUILDING</h1>
      <p style="font-size: 1.2rem;">Tap on enemies to destroy them!</p>
      <p style="font-size: 1rem; color: #ffeb3b; max-width: 80%; margin-top: 10px; line-height: 1.4;">This is an AR game please OK the use of the camera, if nothing works, try to refresh.</p>
      <button id="start-btn">START GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen hidden">
      <h1 style="color: #ff4444;">GAME OVER</h1>
      <p style="font-size: 1.5rem;">Final Score: <strong id="final-score" style="color: #0ff;">0</strong></p>
      <p style="font-size: 1.2rem; margin-top: 10px;">Try again</p>
      <button id="restart-btn">RESTART</button>
    </div>

    <a-scene id="scene" mindar-image="imageTargetSrc: new_targets.mind; autoStart: false;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera id="camera" position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <!-- Smoothed Anchor. All objects will sit inside to move with the image -->
      <a-entity mindar-image-target="targetIndex: 0" id="target-anchor" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <!-- Yellow plane (Target on image) - hidden for now -->
        <!-- <a-plane color="yellow" wireframe="true" width="1" height="1"></a-plane> -->
        
        <!-- White boundary box for spawning - hidden for now -->
        <!-- <a-box color="white" position="0 0 0.75" scale="1.5 1.5 1.5" wireframe="true" opacity="0.3"></a-box> -->
        
        <!-- Green target area - hidden for now so it won't show in-game -->
        <!-- <a-plane id="target-area" color="#00ff00" position="0.2 -0.2 0" width="0.4" height="0.5" opacity="0.5"></a-plane> -->
      </a-entity>
    </a-scene>

    <script>
      let isPlaying = false, score = 0, health = 100, enemies = [];
      let spawnIntervalId = null;
      
      const sceneEl = document.querySelector('a-scene');
      const cameraEl = document.querySelector('#camera');
      const targetAnchor = document.querySelector('#target-anchor');

      // Function to create an explosion effect
      function createExplosion(pos) {
        const explosion = document.createElement('a-sphere');
        explosion.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
        explosion.setAttribute('radius', '0.05');
        explosion.setAttribute('color', '#ff5500'); 
        explosion.setAttribute('material', 'transparent: true; opacity: 1');
        
        explosion.setAttribute('animation__scale', 'property: scale; to: 5 5 5; dur: 400; easing: easeOutQuad');
        explosion.setAttribute('animation__fade', 'property: material.opacity; to: 0; dur: 400; easing: easeOutQuad');
        
        targetAnchor.appendChild(explosion);
        
        setTimeout(() => {
          if (explosion.parentNode) {
            explosion.remove();
          }
        }, 400);
      }

      // Function to shoot a laser to the local hit point (enemy)
      function shootLaser(targetLocalPos) {
        const startPoint = new THREE.Vector3(0.2, 0.05, 0);
        const endPoint = targetLocalPos; 
        
        const laser = document.createElement('a-entity');
        laser.setAttribute('line', `start: ${startPoint.x} ${startPoint.y} ${startPoint.z}; end: ${endPoint.x} ${endPoint.y} ${endPoint.z}; color: #ff0000; opacity: 1;`);
        
        targetAnchor.appendChild(laser);
        
        setTimeout(() => {
          if (laser.parentNode) {
            laser.remove();
          }
        }, 150);
      }

      function spawnEnemy() {
        if(!isPlaying) return;
        
        const enemy = document.createElement('a-box');
        const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffaa44', '#aa44ff'];
        enemy.setAttribute('color', colors[Math.floor(Math.random() * colors.length)]);
        // Reduce cube size to 0.06
        enemy.setAttribute('scale', '0.06 0.06 0.06');
        enemy.setAttribute('draw-edges', '');

        const startX = (Math.random() - 0.5) * 1.5;
        const startY = (Math.random() - 0.5) * 1.5;
        const startZ = 1.5; 
        enemy.setAttribute('position', `${startX} ${startY} ${startZ}`);
        
        const targetX = Math.random() * 0.4;
        const targetY = (Math.random() * 0.5) - 0.45;
        const targetZ = 0;
        const enemyTargetPos = new THREE.Vector3(targetX, targetY, targetZ);
        
        /* // Path line for display (hidden currently)
        const pathLine = document.createElement('a-entity');
        pathLine.setAttribute('line', `start: ${startX} ${startY} ${startZ}; end: ${targetX} ${targetY} ${targetZ}; color: yellow; opacity: 0.6`);
        targetAnchor.appendChild(pathLine);
        */
        
        targetAnchor.appendChild(enemy); 
        
        // Save only the box and its target pos, without the line (which is commented out)
        // If we want to restore the line, change back to: enemies.push({ box: enemy, line: pathLine, targetPos: enemyTargetPos });
        enemies.push({ box: enemy, targetPos: enemyTargetPos });
      }

      // 2D Projection based hit system (Screen distance check)
      window.addEventListener('click', (e) => {
        if(!isPlaying || e.target.tagName === 'BUTTON') return;
        
        const camera = cameraEl.getObject3D('camera');
        
        // Convert click position (pixels) to normalized coordinate system from -1 to 1
        const clickX = (e.clientX / window.innerWidth) * 2 - 1;
        const clickY = -(e.clientY / window.innerHeight) * 2 + 1;
        
        let hitIndex = -1;
        let minDistance = Infinity;
        const vector = new THREE.Vector3();

        for (let i = 0; i < enemies.length; i++) {
          const enemyData = enemies[i];
          
          // Convert 3D position of the enemy to 2D screen position
          vector.setFromMatrixPosition(enemyData.box.object3D.matrixWorld);
          vector.project(camera);
          
          // Calculate the 2D distance between click and enemy
          const dx = vector.x - clickX;
          const dy = vector.y - clickY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          // Check if distance is small enough to be considered a hit (0.15 is a forgiving radius)
          if (distance < 0.15 && distance < minDistance) {
            minDistance = distance;
            hitIndex = i;
          }
        }

        // If we hit an enemy
        if (hitIndex !== -1) {
          const enemyData = enemies[hitIndex];
          const hitPosition = enemyData.box.object3D.position.clone();
          
          // Shoot a laser to the hit position
          shootLaser(hitPosition);
          
          // Trigger explosion
          createExplosion(hitPosition);

          // Remove the box (and the line if it exists)
          enemyData.box.remove();
          if(enemyData.line) enemyData.line.remove(); // Safety check if line is commented out
          enemies.splice(hitIndex, 1);
          
          // Update score
          score += 10;
          document.getElementById('score-val').innerText = score;
        }
      });

      // Main game loop
      function gameLoop() {
        if (!isPlaying) return;
        
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemyData = enemies[i];
          const enemyPos = enemyData.box.object3D.position;
          
          if (enemyPos.distanceTo(enemyData.targetPos) < 0.1) {
             health -= 10;
             document.getElementById('health-val').innerText = health;
             
             createExplosion(enemyPos);

             enemyData.box.remove();
             if(enemyData.line) enemyData.line.remove();
             enemies.splice(i, 1);
             
             if(health <= 0) {
               isPlaying = false;
               clearInterval(spawnIntervalId);
               
               document.getElementById('final-score').innerText = score;
               document.getElementById('ui-container').classList.add('hidden');
               document.getElementById('game-over-screen').classList.remove('hidden');
             }
             continue;
          }
          
          const dir = new THREE.Vector3().subVectors(enemyData.targetPos, enemyPos).normalize();
          enemyData.box.object3D.position.add(dir.multiplyScalar(0.01));
        }
        
        requestAnimationFrame(gameLoop);
      }

      document.getElementById('start-btn').addEventListener('click', async () => {
        await sceneEl.systems["mindar-image-system"].start();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('ui-container').classList.remove('hidden');
        isPlaying = true;
        gameLoop();
        spawnIntervalId = setInterval(spawnEnemy, 1500);
      });

      document.getElementById('restart-btn').addEventListener('click', () => {
        score = 0;
        health = 100;
        document.getElementById('score-val').innerText = score;
        document.getElementById('health-val').innerText = health;
        
        enemies.forEach(e => {
          if (e.box.parentNode) e.box.remove();
          if (e.line && e.line.parentNode) e.line.remove();
        });
        enemies = [];
        
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('ui-container').classList.remove('hidden');
        
        isPlaying = true;
        gameLoop();
        spawnIntervalId = setInterval(spawnEnemy, 1500);
      });
    </script>
  </body>
</html>
