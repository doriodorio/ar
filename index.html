<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הגנת AR על המבנה</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      #ui-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
      #stats-bar { display: flex; justify-content: space-between; padding: 20px; color: white; text-shadow: 2px 2px 4px black; }
      .stat-box { background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 8px; border: 2px solid #0ff; font-weight: bold; font-size: 1.2rem;}
      #health-bar-container { width: 150px; height: 15px; background: #333; border: 2px solid white; border-radius: 10px; overflow: hidden; margin-top: 5px; }
      #health-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.2s; }
      
      #scope-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
      .scope-circle { width: 80px; height: 80px; border: 2px solid rgba(0, 255, 255, 0.7); border-radius: 50%; position: relative; box-shadow: 0 0 15px rgba(0,255,255,0.3) inset, 0 0 15px rgba(0,255,255,0.3); }
      .scope-line-h { position: absolute; top: 50%; left: -15px; width: 110px; height: 2px; background: rgba(0, 255, 255, 0.7); }
      .scope-line-v { position: absolute; left: 50%; top: -15px; height: 110px; width: 2px; background: rgba(0, 255, 255, 0.7); }
      .scope-dot { 
        position: absolute; 
        top: 50%; left: 50%; 
        transform: translate(-50%, -50%); 
        width: 4px; height: 4px; 
        background: red; 
        border-radius: 50%; 
        transition: background-color 0.1s, box-shadow 0.1s, transform 0.1s;
      }
      .scope-dot.firing { background-color: white; box-shadow: 0 0 15px white; transform: translate(-50%, -50%) scale(2); }
      
      #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; transition: opacity 0.1s; pointer-events: none; z-index: 5; }
      
      .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; pointer-events: auto; }
      .hidden { display: none !important; }
      h1 { color: #0ff; font-size: 2.5rem; margin-bottom: 10px; }
      p { font-size: 1.2rem; margin-bottom: 30px; }
      button { padding: 15px 40px; font-size: 1.5rem; background: #0ff; color: black; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; }
    </style>
  </head>
  <body>

    <div id="ui-container" class="hidden">
      <div id="stats-bar">
        <div class="stat-box">ניקוד: <span id="score-val">0</span></div>
        <div class="stat-box">מצב מבנה <div id="health-bar-container"><div id="health-fill"></div></div></div>
      </div>
      <div id="scope-container">
        <div class="scope-circle"><div class="scope-line-h"></div><div class="scope-line-v"></div><div class="scope-dot"></div></div>
      </div>
    </div>

    <div id="damage-flash"></div>

    <div id="start-screen" class="screen">
      <h1>הגן על המגדל</h1>
      <p>1. כוון את המצלמה אל התמונה.<br>2. מקם את האסטרואידים בכוונת ולחץ על המסך לירות!</p>
      <button id="start-btn">הפעל מצלמה</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
      <h1 style="color: red;">כישלון קריטי</h1>
      <h2>ניקוד סופי: <span id="final-score-val">0</span></h2>
      <button id="restart-btn" style="margin-top: 20px;">נסה שוב</button>
    </div>

    <a-scene 
      id="scene"
      mindar-image="imageTargetSrc: new_targets.mind; autoStart: false; uiLoading: no; uiError: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets timeout="10000">
        <a-asset-item id="asteroid-model" src="https://raw.githubusercontent.com/doriodorio/ar/8136d6a51917f3c295d3e1c92aed8e6799df2ee0/3dassets/asteriod.glb"></a-asset-item>
        <img id="rock-texture" src="https://images.unsplash.com/photo-1596422846543-75c6fc197f07?w=512">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
      <a-light type="directional" position="0 5 5" intensity="1.5"></a-light>

      <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
        <a-sphere position="0.25 0 0" radius="0.05" material="color: blue; shader: flat" visible="true"></a-sphere>
      </a-entity>
    </a-scene>

    <script>
      const gameConfig = {
        targetPosition: { x: 0.25, y: 0, z: 0 },
        asteroidScale: "0.5 0.5 0.5",
        asteroidColor: "white",
        enemySpeedBase: 0.05,
        enemySpeedRandom: 0.1
      };

      let isPlaying = false;
      let score = 0;
      let health = 100;
      let targetFound = false;
      let enemies = [];
      let lastTime = performance.now();
      let enemySpawnTimer = 0;
      let enemySpawnInterval = 2000;

      const sceneEl = document.querySelector('#scene');
      const targetAnchor = document.querySelector('#target-anchor');
      const uiContainer = document.getElementById('ui-container');
      const startScreen = document.getElementById('start-screen');
      const gameOverScreen = document.getElementById('game-over-screen');
      const scoreVal = document.getElementById('score-val');
      const healthFill = document.getElementById('health-fill');
      const damageFlash = document.getElementById('damage-flash');
      const finalScoreVal = document.getElementById('final-score-val');
      const scopeDot = document.querySelector('.scope-dot');

      targetAnchor.addEventListener("targetFound", () => { targetFound = true; if(isPlaying) uiContainer.classList.remove('hidden'); });
      targetAnchor.addEventListener("targetLost", () => { targetFound = false; uiContainer.classList.add('hidden'); });

      document.getElementById('start-btn').addEventListener('click', async () => {
        try {
          const mindarSystem = sceneEl.systems["mindar-image-system"];
          if (mindarSystem) {
             startScreen.innerHTML = "<h1>טוען מצלמה...</h1>";
             await mindarSystem.start();
             startScreen.classList.add('hidden');
             startGame();
          }
        } catch(e) {
          console.error("שגיאה בהפעלת המצלמה:", e);
          startScreen.innerHTML = "<h1>שגיאה בהפעלת מצלמה</h1><button onclick='location.reload()'>נסה שוב</button>";
        }
      });

      document.getElementById('restart-btn').addEventListener('click', () => { gameOverScreen.classList.remove('hidden'); startGame(); });

      function startGame() {
        score = 0; health = 100; enemySpawnInterval = 2000; updateUI();
        enemies.forEach(e => { if(e.el.parentNode) e.el.parentNode.removeChild(e.el); });
        enemies = [];
        isPlaying = true;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
        if(targetFound) uiContainer.classList.remove('hidden');
      }

      function updateUI() { scoreVal.innerText = score; healthFill.style.width = health + '%'; }

      function takeDamage(amt) {
        health -= amt; if(health < 0) health = 0;
        updateUI();
        damageFlash.style.opacity = 0.5; setTimeout(() => damageFlash.style.opacity = 0, 100);
        if(health <= 0) { isPlaying = false; uiContainer.classList.add('hidden'); gameOverScreen.classList.remove('hidden'); finalScoreVal.innerText = score; }
      }

      window.addEventListener('mousedown', () => { if(isPlaying && targetFound) firePlayerLaser(); });

      function firePlayerLaser() {
        if (!sceneEl.camera) return;
        scopeDot.classList.add('firing'); setTimeout(() => scopeDot.classList.remove('firing'), 100);
        let hitIndex = -1;
        for (let i = 0; i < enemies.length; i++) {
          let enemy3D = enemies[i].el.object3D;
          let worldPos = new THREE.Vector3(); enemy3D.getWorldPosition(worldPos); worldPos.project(sceneEl.camera);
          if (worldPos.z < 1 && Math.sqrt(worldPos.x * worldPos.x + worldPos.y * worldPos.y) < 0.25) { hitIndex = i; break; }
        }
        if (hitIndex !== -1) {
          enemies[hitIndex].el.parentNode.removeChild(enemies[hitIndex].el);
          enemies.splice(hitIndex, 1); score += 100; updateUI();
        }
      }

      function spawnEnemy() {
        if(!targetFound) return; 
        const enemyEl = document.createElement('a-entity');
        enemyEl.object3D.position.set(0.15 + (Math.random()-0.5)*1.25, (Math.random()-0.5)*1.25, 0.75 + (Math.random()-0.5)*1.0);
        
        // יצירת מודל האסטרואיד
        const modelEl = document.createElement('a-entity');
        modelEl.setAttribute('gltf-model', '#asteroid-model');
        modelEl.setAttribute('material', 'src: #rock-texture; color: ' + gameConfig.asteroidColor);
        modelEl.setAttribute('scale', gameConfig.asteroidScale); 
        enemyEl.appendChild(modelEl);

        // יצירת שובל (שובל עשן/אש)
        const trailEl = document.createElement('a-entity');
        trailEl.setAttribute('geometry', 'primitive: sphere; radius: 0.03');
        trailEl.setAttribute('material', 'color: orange; opacity: 0.6; shader: flat');
        trailEl.setAttribute('position', '0 -0.1 0.1');
        enemyEl.appendChild(trailEl);
        
        targetAnchor.appendChild(enemyEl);
        enemies.push({ el: enemyEl, speed: gameConfig.enemySpeedBase + Math.random() * gameConfig.enemySpeedRandom });
      }

      function gameLoop(time) {
        if(!isPlaying) return;
        requestAnimationFrame(gameLoop);
        let dt = (time - lastTime) / 1000; lastTime = time;
        if(!targetFound) return; 
        enemySpawnTimer += dt * 1000;
        if(enemySpawnTimer > enemySpawnInterval) { spawnEnemy(); enemySpawnTimer = 0; if(enemySpawnInterval > 800) enemySpawnInterval -= 50; }
        for(let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let pos = e.el.object3D.position;
            let target = new THREE.Vector3(gameConfig.targetPosition.x, gameConfig.targetPosition.y, gameConfig.targetPosition.z);
            let dir = new THREE.Vector3().subVectors(target, pos).normalize();
            pos.add(dir.multiplyScalar(e.speed * dt));
            if(pos.distanceTo(target) < 0.1) { takeDamage(10); e.el.parentNode.removeChild(e.el); enemies.splice(i, 1); }
        }
      }
    </script>
  </body>
</html>
