<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>הגנת AR על המבנה</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #ui-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
      #stats-bar { display: flex; justify-content: space-between; padding: 20px; color: white; text-shadow: 2px 2px 4px black; }
      .stat-box { background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 8px; border: 2px solid #0ff; font-weight: bold; font-size: 1.2rem;}
      
      #crosshair { position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; }
      .crosshair-circle { width: 60px; height: 60px; border: 2px solid rgba(255, 255, 0, 0.8); border-radius: 50%; position: absolute; top: 20px; left: 20px; }
      .crosshair-dot { width: 8px; height: 8px; background: red; border-radius: 50%; position: absolute; top: 46px; left: 46px; }

      .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; pointer-events: auto; }
      .hidden { display: none !important; }
      button { padding: 15px 40px; font-size: 1.5rem; background: #0ff; border: none; border-radius: 30px; cursor: pointer; }
    </style>
  </head>
  <body>

    <div id="ui-container" class="hidden">
      <div id="stats-bar">
        <div class="stat-box">ניקוד: <span id="score-val">0</span></div>
        <div class="stat-box">חיים: <span id="health-val">100</span>%</div>
      </div>
      <div id="crosshair">
        <div class="crosshair-circle"></div>
        <div class="crosshair-dot"></div>
      </div>
    </div>

    <div id="start-screen" class="screen">
      <h1>הגן על המבנה</h1>
      <button id="start-btn">התחל משחק</button>
    </div>

    <a-scene id="scene" mindar-image="imageTargetSrc: new_targets.mind; autoStart: false;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera id="camera" position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <!-- הגדרות החלקה (Smoothing) למניעת קפיצות של התמונה -->
      <a-entity mindar-image-target="targetIndex: 0" id="target-anchor" smooth="true" smoothCount="15" smoothTolerance="0.001" smoothThreshold="1">
        <a-sphere id="target-sphere" color="blue" position="0 0 0" radius="0.05" visible="false"></a-sphere>
      </a-entity>
    </a-scene>

    <script>
      let isPlaying = false, score = 0, health = 100, enemies = [];
      const sceneEl = document.querySelector('a-scene');
      const cameraEl = document.querySelector('#camera');
      const targetSphere = document.querySelector('#target-sphere');

      function spawnEnemy() {
        if(!isPlaying) return;
        const enemy = document.createElement('a-box');
        const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffaa44', '#aa44ff'];
        enemy.setAttribute('color', colors[Math.floor(Math.random() * colors.length)]);
        enemy.setAttribute('scale', '0.2 0.2 0.2');
        
        // יצירת אויב במיקום יחסי למיקום המטרה בעולם
        const worldPos = new THREE.Vector3();
        targetSphere.object3D.getWorldPosition(worldPos);
        const x = worldPos.x + (Math.random() - 0.5) * 2;
        const y = worldPos.y + (Math.random() - 0.5) * 2;
        const z = worldPos.z - 2;
        
        enemy.setAttribute('position', `${x} ${y} ${z}`);
        sceneEl.appendChild(enemy); 
        enemies.push(enemy);
      }

      // Screen-space targeting
      window.addEventListener('click', () => {
        if(!isPlaying) return;
        const camera = cameraEl.getObject3D('camera');
        const vector = new THREE.Vector3();
        
        for (let i = enemies.length - 1; i >= 0; i--) {
          vector.setFromMatrixPosition(enemies[i].object3D.matrixWorld);
          vector.project(camera);
          
          // בדיקת מרחק מהמרכז (0,0) - ערך 0.25 הוא סלחני ונוח לטלפון
          if (Math.sqrt(vector.x * vector.x + vector.y * vector.y) < 0.25) {
            enemies[i].remove();
            enemies.splice(i, 1);
            score += 10;
            document.getElementById('score-val').innerText = score;
          }
        }
      });

      function gameLoop() {
        if (!isPlaying) return;
        const targetPos = new THREE.Vector3();
        targetSphere.object3D.getWorldPosition(targetPos);
        
        enemies.forEach(e => {
          const enemyPos = e.object3D.position;
          const dir = new THREE.Vector3().subVectors(targetPos, enemyPos).normalize();
          e.object3D.position.add(dir.multiplyScalar(0.04));
        });
        requestAnimationFrame(gameLoop);
      }

      document.getElementById('start-btn').addEventListener('click', async () => {
        await sceneEl.systems["mindar-image-system"].start();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('ui-container').classList.remove('hidden');
        isPlaying = true;
        gameLoop();
        setInterval(spawnEnemy, 1500);
      });
    </script>
  </body>
</html>
