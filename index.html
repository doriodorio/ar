<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הגנת AR על המבנה</title>
    <!-- אנחנו משתמשים ב-A-Frame ו-MindAR לזיהוי תמונה יציב -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      /* שכבת ממשק משתמש */
      #ui-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 10;
        pointer-events: none; /* מאפשר ללחיצות לעבור לסצנה שמאחור */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* שורת סטטוס עליונה */
      #stats-bar {
        display: flex;
        justify-content: space-between;
        padding: 20px;
        color: white;
        text-shadow: 2px 2px 4px black;
        direction: rtl;
      }

      .stat-box {
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 20px;
        border-radius: 8px;
        border: 2px solid #0ff;
        font-size: 1.2rem;
        font-weight: bold;
        text-align: center;
      }

      #health-bar-container {
        width: 150px;
        height: 15px;
        background: #333;
        border: 2px solid white;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 5px;
      }

      #health-fill {
        width: 100%;
        height: 100%;
        background: #0f0;
        transition: width 0.2s, background-color 0.2s;
      }

      /* כוונת מרכזית */
      #scope-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .scope-circle {
        width: 80px;
        height: 80px;
        border: 2px solid rgba(0, 255, 255, 0.7);
        border-radius: 50%;
        position: relative;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) inset, 0 0 15px rgba(0, 255, 255, 0.3);
      }

      .scope-line-h {
        position: absolute;
        top: 50%;
        left: -15px;
        width: 110px;
        height: 2px;
        background: rgba(0, 255, 255, 0.7);
      }

      .scope-line-v {
        position: absolute;
        left: 50%;
        top: -15px;
        height: 110px;
        width: 2px;
        background: rgba(0, 255, 255, 0.7);
      }

      .scope-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 4px;
        height: 4px;
        background: red;
        border-radius: 50%;
      }

      /* הבהוב פגיעה */
      #damage-flash {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: red;
        opacity: 0;
        transition: opacity 0.1s;
        pointer-events: none;
        z-index: 5;
      }

      /* מסכים */
      .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 20;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        pointer-events: auto;
        direction: rtl;
      }

      .hidden {
        display: none !important;
      }

      h1 { color: #0ff; font-size: 2.5rem; margin-bottom: 10px; }
      p { font-size: 1.2rem; max-width: 80%; line-height: 1.5; margin-bottom: 30px; }
      
      button {
        padding: 15px 40px;
        font-size: 1.5rem;
        background: #0ff;
        color: black;
        border: none;
        border-radius: 30px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
      }
      button:active { transform: scale(0.95); }
    </style>
  </head>
  <body>

    <!-- שכבת ממשק המשתמש -->
    <div id="ui-container" class="hidden">
      <div id="stats-bar">
        <div class="stat-box">ניקוד: <span id="score-val">0</span></div>
        <div class="stat-box">
          מצב מבנה
          <div id="health-bar-container"><div id="health-fill"></div></div>
        </div>
      </div>
      
      <div id="scope-container">
        <div class="scope-circle">
          <div class="scope-line-h"></div>
          <div class="scope-line-v"></div>
          <div class="scope-dot"></div>
        </div>
      </div>
    </div>

    <div id="damage-flash"></div>

    <!-- מסך פתיחה -->
    <div id="start-screen" class="screen">
      <h1>הגן על המגדל</h1>
      <p>1. כוון את המצלמה אל הפוסטר.<br>2. כשהמבנה יזוהה, יופיעו חלליות אויב.<br>3. מקם את החלליות בתוך הכוונת ולחץ על המסך כדי לירות!</p>
      <button id="start-btn">הפעל מצלמה</button>
    </div>

    <!-- מסך סיום משחק -->
    <div id="game-over-screen" class="screen hidden">
      <h1 style="color: red;">כישלון קריטי</h1>
      <p>המבנה נהרס כליל.</p>
      <h2>ניקוד סופי: <span id="final-score-val">0</span></h2>
      <button id="restart-btn" style="margin-top: 20px;">נסה שוב</button>
    </div>


    <a-scene 
      mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiError: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-mixin id="laser-beam" geometry="primitive: cylinder; radius: 0.02; height: 1" material="color: #0ff; emissive: #0ff; emissiveIntensity: 2" rotation="90 0 0"></a-mixin>
        <a-mixin id="enemy-laser" geometry="primitive: cylinder; radius: 0.03; height: 0.5" material="color: #f00; emissive: #f00; emissiveIntensity: 2" rotation="90 0 0"></a-mixin>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
      <a-light type="directional" position="0 5 5" intensity="0.5"></a-light>

      <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
        <!-- מסגרת בולטת מאד לבדיקת זיהוי -->
        <a-entity geometry="primitive: plane; width: 1.2; height: 1.2" material="color: yellow; wireframe: true; wireframeLinewidth: 10" position="0 0 0"></a-entity>
        <a-entity geometry="primitive: plane; width: 1.1; height: 1.1" material="color: white; wireframe: true; wireframeLinewidth: 5" position="0 0 0"></a-entity>
        
        <a-box id="building-hitbox" position="0 0 0" width="1" height="2" depth="1" visible="false"></a-box>
      </a-entity>
    </a-scene>

    <script>
      let isPlaying = false;
      let score = 0;
      let health = 100;
      let targetFound = false;
      
      let enemies = [];
      let playerLasers = [];
      let enemyLasers = [];
      
      let lastTime = performance.now();
      let enemySpawnTimer = 0;
      let enemySpawnInterval = 2500;

      const sceneEl = document.querySelector('a-scene');
      const targetAnchor = document.querySelector('#target-anchor');
      
      const uiContainer = document.getElementById('ui-container');
      const startScreen = document.getElementById('start-screen');
      const gameOverScreen = document.getElementById('game-over-screen');
      const scoreVal = document.getElementById('score-val');
      const healthFill = document.getElementById('health-fill');
      const damageFlash = document.getElementById('damage-flash');
      const finalScoreVal = document.getElementById('final-score-val');

      targetAnchor.addEventListener("targetFound", event => {
        targetFound = true;
        if(isPlaying) uiContainer.classList.remove('hidden');
      });

      targetAnchor.addEventListener("targetLost", event => {
        targetFound = false;
        uiContainer.classList.add('hidden');
      });

      document.getElementById('start-btn').addEventListener('click', () => {
        startScreen.classList.add('hidden');
        sceneEl.systems["mindar-image-system"].start();
        startGame();
      });

      document.getElementById('restart-btn').addEventListener('click', () => {
        gameOverScreen.classList.add('hidden');
        startGame();
      });

      function startGame() {
        score = 0;
        health = 100;
        enemySpawnInterval = 2500;
        updateUI();
        
        enemies.forEach(e => e.el.parentNode.removeChild(e.el));
        playerLasers.forEach(l => l.el.parentNode.removeChild(l.el));
        enemyLasers.forEach(l => l.el.parentNode.removeChild(l.el));
        enemies = [];
        playerLasers = [];
        enemyLasers = [];

        isPlaying = true;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
        
        if(targetFound) uiContainer.classList.remove('hidden');
      }

      function endGame() {
        isPlaying = false;
        uiContainer.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalScoreVal.innerText = score;
      }

      function updateUI() {
        scoreVal.innerText = score;
        healthFill.style.width = health + '%';
        if(health > 50) healthFill.style.background = '#0f0';
        else if (health > 25) healthFill.style.background = '#ff0';
        else healthFill.style.background = '#f00';
      }

      function takeDamage(amt) {
        health -= amt;
        if(health < 0) health = 0;
        updateUI();
        
        damageFlash.style.opacity = 0.5;
        setTimeout(() => damageFlash.style.opacity = 0, 100);

        if(health <= 0) endGame();
      }

      window.addEventListener('touchstart', (e) => {
        if(!isPlaying || !targetFound || e.target.tagName === 'BUTTON') return;
        e.preventDefault();
        firePlayerLaser();
      }, {passive: false});

      window.addEventListener('mousedown', (e) => {
        if(!isPlaying || !targetFound || e.target.tagName === 'BUTTON') return;
        firePlayerLaser();
      });

      function firePlayerLaser() {
        const laserEl = document.createElement('a-entity');
        laserEl.setAttribute('mixin', 'laser-beam');
        laserEl.setAttribute('position', '0 -0.2 -0.5'); 
        sceneEl.appendChild(laserEl);
        
        playerLasers.push({
            el: laserEl,
            pos: new THREE.Vector3(0, -0.2, -0.5),
            dir: new THREE.Vector3(0, 0, -1),
            speed: 15,
            life: 2.0
        });
      }

      function spawnEnemy() {
        if(!targetFound) return; 

        const enemyEl = document.createElement('a-sphere');
        enemyEl.setAttribute('radius', '0.15'); 
        enemyEl.setAttribute('color', '#ff0000'); 

        const x = (Math.random() - 0.5) * 2.0; 
        const y = (Math.random() - 0.5) * 2.0; 
        const z = 0.1 + (Math.random() * 0.2); 

        enemyEl.setAttribute('position', `${x} ${y} ${z}`);
        targetAnchor.appendChild(enemyEl);

        enemies.push({
            el: enemyEl,
            health: 2,
            speed: 0.1 + Math.random() * 0.1,
            lastFire: performance.now() + Math.random() * 2000,
            fireRate: 2000 + Math.random() * 2000
        });
      }

      function fireEnemyLaser(enemyObj) {
        const laserEl = document.createElement('a-entity');
        laserEl.setAttribute('mixin', 'enemy-laser');
        const pos = enemyObj.el.getAttribute('position');
        laserEl.setAttribute('position', pos);
        targetAnchor.appendChild(laserEl);
        const dir = new THREE.Vector3(-pos.x, -pos.y, -pos.z).normalize();
        laserEl.object3D.lookAt(0,0,0);

        enemyLasers.push({
            el: laserEl,
            pos: new THREE.Vector3(pos.x, pos.y, pos.z),
            dir: dir,
            speed: 2,
            life: 3.0
        });
      }

      function gameLoop(time) {
        if(!isPlaying) return;
        requestAnimationFrame(gameLoop);

        let dt = (time - lastTime) / 1000;
        if(dt > 0.1) dt = 0.1;
        lastTime = time;

        if(!targetFound) return; 

        enemySpawnTimer += dt * 1000;
        if(enemySpawnTimer > enemySpawnInterval) {
            spawnEnemy();
            enemySpawnTimer = 0;
            if(enemySpawnInterval > 800) enemySpawnInterval -= 50; 
        }

        for(let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let pos = e.el.object3D.position;
            let dir = new THREE.Vector3(-pos.x, -pos.y, -pos.z).normalize();
            pos.add(dir.multiplyScalar(e.speed * dt));
            
            if(pos.length() < 0.2) {
                takeDamage(10);
                e.el.parentNode.removeChild(e.el);
                enemies.splice(i, 1);
                continue;
            }

            if(time > e.lastFire + e.fireRate) {
                fireEnemyLaser(e);
                e.lastFire = time;
            }
        }

        for(let i = playerLasers.length - 1; i >= 0; i--) {
            let l = playerLasers[i];
            l.pos.add(l.dir.clone().multiplyScalar(l.speed * dt));
            l.el.object3D.position.copy(l.pos);
            l.life -= dt;

            let hit = false;
            let laserWorldPos = l.pos;

            for(let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                let enemyWorldPos = new THREE.Vector3();
                e.el.object3D.getWorldPosition(enemyWorldPos);

                if(laserWorldPos.distanceTo(enemyWorldPos) < 0.4) { 
                    hit = true;
                    e.health--;
                    if(e.health <= 0) {
                        e.el.parentNode.removeChild(e.el);
                        enemies.splice(j, 1);
                        score += 100;
                        updateUI();
                    }
                    break;
                }
            }

            if(hit || l.life <= 0) {
                l.el.parentNode.removeChild(l.el);
                playerLasers.splice(i, 1);
            }
        }

        for(let i = enemyLasers.length - 1; i >= 0; i--) {
            let l = enemyLasers[i];
            l.pos.add(l.dir.clone().multiplyScalar(l.speed * dt));
            l.el.object3D.position.copy(l.pos);
            l.life -= dt;

            if(l.pos.length() < 0.2) {
                takeDamage(5);
                l.el.parentNode.removeChild(l.el);
                enemyLasers.splice(i, 1);
                continue;
            }

            if(l.life <= 0) {
                l.el.parentNode.removeChild(l.el);
                enemyLasers.splice(l, 1);
            }
        }
      }
    </script>
  </body>
</html>
