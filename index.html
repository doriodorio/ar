<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הגנת AR על המבנה</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      /* ממשק משתמש */
      #ui-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
      #stats-bar { display: flex; justify-content: space-between; padding: 20px; color: white; text-shadow: 2px 2px 4px black; }
      .stat-box { background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 8px; border: 2px solid #0ff; font-weight: bold; font-size: 1.2rem;}
      #health-bar-container { width: 150px; height: 15px; background: #333; border: 2px solid white; border-radius: 10px; overflow: hidden; margin-top: 5px; }
      #health-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.2s; }
      
      /* כוונת */
      #scope-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
      .scope-circle { width: 80px; height: 80px; border: 2px solid rgba(0, 255, 255, 0.7); border-radius: 50%; position: relative; box-shadow: 0 0 15px rgba(0,255,255,0.3) inset, 0 0 15px rgba(0,255,255,0.3); }
      .scope-line-h { position: absolute; top: 50%; left: -15px; width: 110px; height: 2px; background: rgba(0, 255, 255, 0.7); }
      .scope-line-v { position: absolute; left: 50%; top: -15px; height: 110px; width: 2px; background: rgba(0, 255, 255, 0.7); }
      .scope-dot { 
        position: absolute; 
        top: 50%; left: 50%; 
        transform: translate(-50%, -50%); 
        width: 4px; height: 4px; 
        background: red; 
        border-radius: 50%; 
        transition: background-color 0.1s, box-shadow 0.1s, transform 0.1s;
      }
      /* אפקט ירייה בכוונת */
      .scope-dot.firing {
        background-color: white;
        box-shadow: 0 0 15px white;
        transform: translate(-50%, -50%) scale(2);
      }
      
      #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; transition: opacity 0.1s; pointer-events: none; z-index: 5; }
      
      /* מסכים */
      .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; pointer-events: auto; }
      .hidden { display: none !important; }
      h1 { color: #0ff; font-size: 2.5rem; margin-bottom: 10px; }
      p { font-size: 1.2rem; margin-bottom: 30px; }
      button { padding: 15px 40px; font-size: 1.5rem; background: #0ff; color: black; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; }
    </style>
  </head>
  <body>

    <div id="ui-container" class="hidden">
      <div id="stats-bar">
        <div class="stat-box">ניקוד: <span id="score-val">0</span></div>
        <div class="stat-box">מצב מבנה <div id="health-bar-container"><div id="health-fill"></div></div></div>
      </div>
      <div id="scope-container">
        <div class="scope-circle"><div class="scope-line-h"></div><div class="scope-line-v"></div><div class="scope-dot"></div></div>
      </div>
    </div>

    <div id="damage-flash"></div>

    <div id="start-screen" class="screen">
      <h1>הגן על המגדל</h1>
      <p>1. כוון את המצלמה אל התמונה.<br>2. מקם את האויבים בכוונת ולחץ על המסך לירות!</p>
      <button id="start-btn">הפעל מצלמה</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
      <h1 style="color: red;">כישלון קריטי</h1>
      <h2>ניקוד סופי: <span id="final-score-val">0</span></h2>
      <button id="restart-btn" style="margin-top: 20px;">נסה שוב</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiError: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- הגדרנו טיימאאוט למקרה שהמודל חסר, כך שהמשחק לא ייתקע -->
      <a-assets timeout="10000">
        <!-- שימוש בכתובת הישירה (Raw) כדי למנוע בעיות נתיבים -->
        <a-asset-item id="spaceship-model" src="https://raw.githubusercontent.com/doriodorio/ar/main/3dassets/ship15cm.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
      <a-light type="directional" position="0 5 5" intensity="1.5"></a-light>

      <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
        
        <!-- החזרנו את הקופסה האדומה וסידרנו את הגדרות הצבע שלה כדי שתבלוט תמיד -->
        <a-box 
          id="spawn-zone"
          visible="true"
          width="1.25" 
          height="1.25" 
          depth="1" 
          position="0.15 0 0.75"
          material="color: red; wireframe: true; wireframeLinewidth: 5; shader: flat">
        </a-box>
        
        <!-- נקודת היעד -->
        <a-sphere position="0.25 0 0" radius="0.05" material="color: blue; shader: flat" visible="true"></a-sphere>

      </a-entity>
    </a-scene>

    <script>
      let isPlaying = false;
      let score = 0;
      let health = 100;
      let targetFound = false;
      
      let enemies = [];
      
      let lastTime = performance.now();
      let enemySpawnTimer = 0;
      let enemySpawnInterval = 2000;

      // יעד התנועה של האויבים
      const TARGET_POINT = new THREE.Vector3(0.25, 0, 0);

      const sceneEl = document.querySelector('a-scene');
      const targetAnchor = document.querySelector('#target-anchor');
      const uiContainer = document.getElementById('ui-container');
      const startScreen = document.getElementById('start-screen');
      const gameOverScreen = document.getElementById('game-over-screen');
      const scoreVal = document.getElementById('score-val');
      const healthFill = document.getElementById('health-fill');
      const damageFlash = document.getElementById('damage-flash');
      const finalScoreVal = document.getElementById('final-score-val');
      const scopeDot = document.querySelector('.scope-dot');

      targetAnchor.addEventListener("targetFound", () => {
        targetFound = true;
        if(isPlaying) uiContainer.classList.remove('hidden');
      });

      targetAnchor.addEventListener("targetLost", () => {
        targetFound = false;
        uiContainer.classList.add('hidden');
      });

      document.getElementById('start-btn').addEventListener('click', () => {
        startScreen.classList.add('hidden');
        sceneEl.systems["mindar-image-system"].start();
        startGame();
      });

      document.getElementById('restart-btn').addEventListener('click', () => {
        gameOverScreen.classList.add('hidden');
        startGame();
      });

      function startGame() {
        score = 0;
        health = 100;
        enemySpawnInterval = 2000;
        updateUI();
        
        enemies.forEach(e => e.el.parentNode.removeChild(e.el));
        enemies = [];

        isPlaying = true;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
        
        if(targetFound) uiContainer.classList.remove('hidden');
      }

      function endGame() {
        isPlaying = false;
        uiContainer.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        finalScoreVal.innerText = score;
      }

      function updateUI() {
        scoreVal.innerText = score;
        healthFill.style.width = health + '%';
        if(health > 50) healthFill.style.background = '#0f0';
        else if (health > 25) healthFill.style.background = '#ff0';
        else healthFill.style.background = '#f00';
      }

      function takeDamage(amt) {
        health -= amt;
        if(health < 0) health = 0;
        updateUI();
        damageFlash.style.opacity = 0.5;
        setTimeout(() => damageFlash.style.opacity = 0, 100);
        if(health <= 0) endGame();
      }

      // --- מערכת ירי באמצעות המרת מיקום המסך ---
      window.addEventListener('touchstart', (e) => {
        if(!isPlaying || !targetFound || e.target.tagName === 'BUTTON') return;
        e.preventDefault();
        firePlayerLaser();
      }, {passive: false});

      window.addEventListener('mousedown', (e) => {
        if(!isPlaying || !targetFound || e.target.tagName === 'BUTTON') return;
        firePlayerLaser();
      });

      function firePlayerLaser() {
        if (!sceneEl.camera) return;

        scopeDot.classList.add('firing');
        setTimeout(() => scopeDot.classList.remove('firing'), 100);

        let hitIndex = -1;
        let closestDist = Infinity;

        for (let i = 0; i < enemies.length; i++) {
          let enemy3D = enemies[i].el.object3D;
          
          let worldPos = new THREE.Vector3();
          enemy3D.getWorldPosition(worldPos);
          worldPos.project(sceneEl.camera);

          if (worldPos.z < 1) {
            let distToCenter = Math.sqrt(worldPos.x * worldPos.x + worldPos.y * worldPos.y);

            // אם האויב בתוך רדיוס הכוונת
            if (distToCenter < 0.25 && distToCenter < closestDist) {
              closestDist = distToCenter;
              hitIndex = i;
            }
          }
        }

        if (hitIndex !== -1) {
          let hitEnemy = enemies[hitIndex];
          hitEnemy.el.parentNode.removeChild(hitEnemy.el);
          enemies.splice(hitIndex, 1);
          score += 100;
          updateUI();
        }
      }

      // --- היווצרות אויבים ---
      function spawnEnemy() {
        if(!targetFound) return; 

        // יוצרים קונטיינר ריק שיכיל גם את הקובייה וגם את המודל
        const enemyEl = document.createElement('a-entity');
        
        // חישוב מיקום אקראי בתוך התיבה המקורית:
        const x = 0.15 + (Math.random() - 0.5) * 1.25; 
        const y = 0 + (Math.random() - 0.5) * 1.25; 
        const z = 0.75 + (Math.random() - 0.5) * 1.0; 

        enemyEl.setAttribute('position', `${x} ${y} ${z}`);
        
        // כיוון האויב להסתכל על נקודת היעד
        enemyEl.object3D.lookAt(TARGET_POINT);

        // 1. הוספת קוביית Wireframe כתומה (בגישה מפורשת כדי להבטיח שקיפות)
        const boxEl = document.createElement('a-entity');
        boxEl.setAttribute('geometry', 'primitive: box; width: 0.15; height: 0.15; depth: 0.15');
        boxEl.setAttribute('material', 'color: #ffaa00; wireframe: true; wireframeLinewidth: 2; shader: flat');
        enemyEl.appendChild(boxEl);

        // 2. הוספת מודל החללית לתוך אותו קונטיינר
        const modelEl = document.createElement('a-entity');
        modelEl.setAttribute('gltf-model', '#spaceship-model');
        modelEl.setAttribute('scale', '0.1 0.1 0.1'); // שינוי הגודל ל-0.1 כפי שביקשת
        modelEl.setAttribute('rotation', '0 0 90'); // סיבוב לפי בקשתך
        enemyEl.appendChild(modelEl);

        targetAnchor.appendChild(enemyEl);

        enemies.push({
            el: enemyEl,
            health: 1,
            speed: 0.1 + Math.random() * 0.15
        });
      }

      // --- לולאת המשחק ---
      function gameLoop(time) {
        if(!isPlaying) return;
        requestAnimationFrame(gameLoop);

        let dt = (time - lastTime) / 1000;
        if(dt > 0.1) dt = 0.1;
        lastTime = time;

        if(!targetFound) return; 

        enemySpawnTimer += dt * 1000;
        if(enemySpawnTimer > enemySpawnInterval) {
            spawnEnemy();
            enemySpawnTimer = 0;
            if(enemySpawnInterval > 800) enemySpawnInterval -= 50; 
        }

        for(let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let pos = e.el.object3D.position;
            
            let dir = new THREE.Vector3().subVectors(TARGET_POINT, pos).normalize();
            pos.add(dir.multiplyScalar(e.speed * dt));
            
            if(pos.distanceTo(TARGET_POINT) < 0.1) {
                takeDamage(10);
                e.el.parentNode.removeChild(e.el);
                enemies.splice(i, 1);
                continue;
            }
        }
      }
    </script>
  </body>
</html>
