<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הגנת AR על המבנה</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      
      #ui-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
      #stats-bar { display: flex; justify-content: space-between; padding: 20px; color: white; text-shadow: 2px 2px 4px black; }
      .stat-box { background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 8px; border: 2px solid #0ff; font-weight: bold; font-size: 1.2rem;}
      #health-bar-container { width: 150px; height: 15px; background: #333; border: 2px solid white; border-radius: 10px; overflow: hidden; margin-top: 5px; }
      #health-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.2s; }
      
      #scope-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; width: 100px; height: 100px; }
      .scope-circle { width: 80px; height: 80px; border: 2px solid rgba(0, 255, 255, 0.7); border-radius: 50%; position: absolute; top: 10px; left: 10px; box-shadow: 0 0 15px rgba(0,255,255,0.3) inset, 0 0 15px rgba(0,255,255,0.3); }
      .scope-line-h { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(0, 255, 255, 0.7); transform: translateY(-50%); }
      .scope-line-v { position: absolute; left: 50%; top: 0; height: 100%; width: 2px; background: rgba(0, 255, 255, 0.7); transform: translateX(-50%); }
      .scope-dot { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; background: #ff0000; border-radius: 50%; border: 1px solid white; z-index: 100; box-shadow: 0 0 5px rgba(255,0,0,0.8); }
      
      .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; pointer-events: auto; }
      .hidden { display: none !important; }
      h1 { color: #0ff; font-size: 2.5rem; margin-bottom: 10px; }
      p { font-size: 1.2rem; margin-bottom: 30px; }
      button { padding: 15px 40px; font-size: 1.5rem; background: #0ff; color: black; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; }
    </style>
  </head>
  <body>

    <div id="ui-container" class="hidden">
      <div id="stats-bar">
        <div class="stat-box">ניקוד: <span id="score-val">0</span></div>
        <div class="stat-box">מצב מבנה <div id="health-bar-container"><div id="health-fill"></div></div></div>
      </div>
      <div id="scope-container">
        <div class="scope-circle"></div>
        <div class="scope-line-h"></div>
        <div class="scope-line-v"></div>
        <div class="scope-dot"></div>
      </div>
    </div>

    <div id="start-screen" class="screen">
      <h1>הגן על המגדל</h1>
      <p>1. כוון את המצלמה אל התמונה.<br>2. השמד את הקוביות בטרם יגיעו למגדל המרכזי!</p>
      <button id="start-btn">הפעל מצלמה</button>
    </div>

    <a-scene 
      id="scene"
      mindar-image="imageTargetSrc: new_targets.mind; autoStart: false; uiLoading: no; uiError: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
      <a-light type="directional" position="0 5 5" intensity="1.5"></a-light>

      <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
        <!-- המשטח המזוהה -->
        <a-plane color="yellow" rotation="0 0 0" scale="1 1 1" wireframe="true" width="1" height="1"></a-plane>
        
        <!-- אזור יצירת האויבים - תיבה בווייר-פריים שמתחילה מהמשטח ועמוקה פי 2 -->
        <!-- המיקום Z הוא -1 כדי שהחלק האחורי יחפוף למשטח (Z=0) -->
        <a-box color="white" position="0 0 -1" scale="2 2 2" wireframe="true" opacity="0.5"></a-box>
      </a-entity>
    </a-scene>

    <script>
      const gameConfig = { cubeScale: "0.2 0.2 0.2", enemySpeed: 0.005 };
      let isPlaying = false, score = 0, targetFound = false, enemies = [];
      const sceneEl = document.querySelector('#scene'), targetAnchor = document.querySelector('#target-anchor'), uiContainer = document.getElementById('ui-container');
      
      document.getElementById('start-btn').addEventListener('click', async () => {
        try {
          await sceneEl.systems["mindar-image-system"].start();
          document.getElementById('start-screen').classList.add('hidden');
          isPlaying = true;
          requestAnimationFrame(gameLoop);
        } catch(e) { console.error(e); }
      });

      function spawnEnemy() {
        if(!targetFound || !isPlaying) return;
        const enemyEl = document.createElement('a-entity');
        // יצירה בתוך טווח התיבה: X ו-Y בין 1- ל-1, Z בין 0 ל-2-
        const x = (Math.random() - 0.5) * 2;
        const y = (Math.random() - 0.5) * 2;
        const z = -Math.random() * 2; 
        enemyEl.object3D.position.set(x, y, z);
        
        const boxEl = document.createElement('a-box');
        boxEl.setAttribute('color', "#00ffff");
        boxEl.setAttribute('scale', gameConfig.cubeScale);
        enemyEl.appendChild(boxEl);
        targetAnchor.appendChild(enemyEl);
        enemies.push(enemyEl);
      }

      function gameLoop() {
        if(!isPlaying) return;
        if(Math.random() < 0.03) spawnEnemy();
        requestAnimationFrame(gameLoop);
      }

      targetAnchor.addEventListener("targetFound", () => { targetFound = true; uiContainer.classList.remove('hidden'); });
      targetAnchor.addEventListener("targetLost", () => { targetFound = false; uiContainer.classList.add('hidden'); });
    </script>
  </body>
</html>
