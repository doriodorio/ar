<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>הגנת AR על המבנה</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #ui-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
      #stats-bar { display: flex; justify-content: space-between; padding: 20px; color: white; text-shadow: 2px 2px 4px black; }
      .stat-box { background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 8px; border: 2px solid #0ff; font-weight: bold; font-size: 1.2rem;}
      #version-display { position: absolute; top: 10px; right: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px; font-size: 0.8rem; z-index: 100; }
      
      #crosshair { position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; }
      .crosshair-circle { width: 60px; height: 60px; border: 2px solid rgba(255, 255, 0, 0.8); border-radius: 50%; position: absolute; top: 20px; left: 20px; }
      .crosshair-dot { width: 8px; height: 8px; background: red; border-radius: 50%; position: absolute; top: 46px; left: 46px; }

      .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; pointer-events: auto; }
      .hidden { display: none !important; }
      button { padding: 15px 40px; font-size: 1.5rem; background: #0ff; border: none; border-radius: 30px; cursor: pointer; }
    </style>
  </head>
  <body>

    <div id="version-display">גרסה: 1.1.6</div>

    <div id="ui-container" class="hidden">
      <div id="stats-bar">
        <div class="stat-box">ניקוד: <span id="score-val">0</span></div>
        <div class="stat-box">חיים: <span id="health-val">100</span>%</div>
      </div>
      <div id="crosshair">
        <div class="crosshair-circle"></div>
        <div class="crosshair-dot"></div>
      </div>
    </div>

    <div id="start-screen" class="screen">
      <h1>הגן על המבנה</h1>
      <button id="start-btn">התחל משחק</button>
    </div>

    <a-scene id="scene" mindar-image="imageTargetSrc: new_targets.mind; autoStart: false;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera id="camera" position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <!-- Anchor מוחלק. כל האובייקטים יישבו בתוכו כדי לנוע יחד עם התמונה -->
      <a-entity mindar-image-target="targetIndex: 0" id="target-anchor" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <!-- משטח צהוב (המטרה על התמונה) -->
        <a-plane color="yellow" wireframe="true" width="1" height="1"></a-plane>
        <!-- קוביית הגבולות הלבנה להיווצרות אויבים - כעת בולטת החוצה (Z חיובי) -->
        <a-box color="white" position="0 0 0.75" scale="1.5 1.5 1.5" wireframe="true" opacity="0.3"></a-box>
        <!-- מטרה מרכזית גלויה כדי לראות את יעד הקוביות -->
        <a-sphere id="target-sphere" color="blue" position="0 0 0" radius="0.05" visible="true"></a-sphere>
      </a-entity>
    </a-scene>

    <script>
      let isPlaying = false, score = 0, health = 100, enemies = [];
      const sceneEl = document.querySelector('a-scene');
      const cameraEl = document.querySelector('#camera');
      const targetAnchor = document.querySelector('#target-anchor');
      
      // המטרה שלנו היא נקודת ה-0,0,0 בתוך ה-Anchor (המרכז של התמונה)
      const targetLocalPos = new THREE.Vector3(0, 0, 0);

      function spawnEnemy() {
        if(!isPlaying) return;
        
        // יצירת קוביה
        const enemy = document.createElement('a-box');
        const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffaa44', '#aa44ff'];
        enemy.setAttribute('color', colors[Math.floor(Math.random() * colors.length)]);
        // הגודל הוקטן לחצי (מ-0.15 ל-0.075)
        enemy.setAttribute('scale', '0.075 0.075 0.075');
        
        // מיקום מקומי ביחס ל-Anchor (בדיוק על הדופן הקדמית של הקוביה הלבנה, בולט החוצה)
        const x = (Math.random() - 0.5) * 1.5;
        const y = (Math.random() - 0.5) * 1.5;
        const z = 1.5; // Z חיובי: יוצא מתוך התמונה לכיוון המשתמש
        enemy.setAttribute('position', `${x} ${y} ${z}`);
        
        // קו מסלול לתצוגה (דיבוג) - עכשיו הקו ילך מ-1.5 פנימה ל-0
        const pathLine = document.createElement('a-entity');
        pathLine.setAttribute('line', `start: ${x} ${y} ${z}; end: 0 0 0; color: yellow; opacity: 0.6`);
        
        // הוספה ל-Anchor כדי שזה יעקוב אחרי התמונה באופן מדויק
        targetAnchor.appendChild(pathLine);
        targetAnchor.appendChild(enemy); 
        
        // שומרים גם את הקוביה וגם את הקו כדי שנוכל למחוק את שניהם
        enemies.push({ box: enemy, line: pathLine });
      }

      // מערכת כיוון ופגיעה (Screen-space targeting)
      window.addEventListener('click', () => {
        if(!isPlaying) return;
        const camera = cameraEl.getObject3D('camera');
        const vector = new THREE.Vector3();
        
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemyData = enemies[i];
          vector.setFromMatrixPosition(enemyData.box.object3D.matrixWorld);
          vector.project(camera);
          
          if (Math.sqrt(vector.x * vector.x + vector.y * vector.y) < 0.25) {
            enemyData.box.remove();
            enemyData.line.remove(); // מחיקת קו המסלול
            enemies.splice(i, 1);
            score += 10;
            document.getElementById('score-val').innerText = score;
          }
        }
      });

      // לולאת משחק מרכזית
      function gameLoop() {
        if (!isPlaying) return;
        
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemyData = enemies[i];
          const enemyPos = enemyData.box.object3D.position;
          
          // בדיקת הגעה למטרה (מרחק קצר מ-0.1)
          if (enemyPos.distanceTo(targetLocalPos) < 0.1) {
             health -= 10;
             document.getElementById('health-val').innerText = health;
             enemyData.box.remove();
             enemyData.line.remove();
             enemies.splice(i, 1);
             
             if(health <= 0) {
               isPlaying = false;
               alert("המשחק נגמר!");
             }
             continue;
          }
          
          // תנועה לעבר המרכז בסביבה המקומית
          const dir = new THREE.Vector3().subVectors(targetLocalPos, enemyPos).normalize();
          enemyData.box.object3D.position.add(dir.multiplyScalar(0.02)); // מהירות התקדמות
        }
        
        requestAnimationFrame(gameLoop);
      }

      document.getElementById('start-btn').addEventListener('click', async () => {
        await sceneEl.systems["mindar-image-system"].start();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('ui-container').classList.remove('hidden');
        isPlaying = true;
        gameLoop();
        setInterval(spawnEnemy, 1500); // אויב חדש כל 1.5 שניות
      });
    </script>
  </body>
</html>
