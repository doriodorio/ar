<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Square Tracker</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
      button { padding: 20px 40px; font-size: 1.5rem; cursor: pointer; }
    </style>
  </head>
  <body>

    <div id="start-screen" class="screen">
      <h1>בדיקת זיהוי תמונה</h1>
      <button id="start-btn">הפעל מצלמה</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiError: no;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- תיבה במידות 1.5x1.5x1.5 שממוקמת כעת מוצמדת לצד שמאל -->
        <a-box 
          color="red" 
          width="1.25	" 
          height="1.25" 
          depth="1" 
          position="0 0 0.75" 
          material="wireframe: true; wireframeLinewidth: 5; shader: flat">
        </a-box>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const startScreen = document.getElementById('start-screen');

      document.getElementById('start-btn').addEventListener('click', () => {
        startScreen.style.display = 'none';
        sceneEl.systems["mindar-image-system"].start();
      });
    </script>
  </body>
</html>
