<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>הגנת AR על המבנה</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      // רכיב מיוחד שמצייר רק את קווי המתאר החיצוניים (ללא אלכסונים)
      AFRAME.registerComponent('draw-edges', {
        init: function () {
          this.el.addEventListener('loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (mesh) {
              const edges = new THREE.EdgesGeometry(mesh.geometry);
              const material = new THREE.LineBasicMaterial({ color: 0x000000 });
              const lineSegments = new THREE.LineSegments(edges, material);
              mesh.add(lineSegments);
            }
          });
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #ui-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
      #stats-bar { display: flex; justify-content: space-between; padding: 20px; color: white; text-shadow: 2px 2px 4px black; }
      .stat-box { background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 8px; border: 2px solid #0ff; font-weight: bold; font-size: 1.2rem;}
      #version-display { position: absolute; top: 10px; right: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px; font-size: 0.8rem; z-index: 100; }
      
      #crosshair { position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; }
      .crosshair-circle { width: 60px; height: 60px; border: 2px solid rgba(255, 255, 0, 0.8); border-radius: 50%; position: absolute; top: 20px; left: 20px; }
      .crosshair-dot { width: 8px; height: 8px; background: red; border-radius: 50%; position: absolute; top: 46px; left: 46px; }

      .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; pointer-events: auto; }
      .hidden { display: none !important; }
      button { padding: 15px 40px; font-size: 1.5rem; background: #0ff; border: none; border-radius: 30px; cursor: pointer; margin-top: 15px; }
    </style>
  </head>
  <body>

    <div id="version-display">גרסה: 1.2.2</div>

    <div id="ui-container" class="hidden">
      <div id="stats-bar">
        <div class="stat-box">ניקוד: <span id="score-val">0</span></div>
        <div class="stat-box">חיים: <span id="health-val">100</span>%</div>
      </div>
      <div id="crosshair">
        <div class="crosshair-circle"></div>
        <div class="crosshair-dot"></div>
      </div>
    </div>

    <!-- מסך התחלה -->
    <div id="start-screen" class="screen">
      <h1>הגן על המבנה</h1>
      <button id="start-btn">התחל משחק</button>
    </div>

    <!-- מסך סיום משחק -->
    <div id="game-over-screen" class="screen hidden">
      <h1 style="color: #ff4444;">המשחק נגמר</h1>
      <p style="font-size: 1.5rem;">ניקוד סופי: <strong id="final-score" style="color: #0ff;">0</strong></p>
      <p style="font-size: 1.2rem; margin-top: 10px;">נסה שוב</p>
      <button id="restart-btn">התחל מחדש</button>
    </div>

    <a-scene id="scene" mindar-image="imageTargetSrc: new_targets.mind; autoStart: false;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera id="camera" position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <!-- Anchor מוחלק. כל האובייקטים יישבו בתוכו כדי לנוע יחד עם התמונה -->
      <a-entity mindar-image-target="targetIndex: 0" id="target-anchor" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <!-- משטח צהוב (המטרה על התמונה) -->
        <a-plane color="yellow" wireframe="true" width="1" height="1"></a-plane>
        <!-- קוביית הגבולות הלבנה להיווצרות אויבים -->
        <a-box color="white" position="0 0 0.75" scale="1.5 1.5 1.5" wireframe="true" opacity="0.3"></a-box>
        <!-- אזור המטרה הירוק -->
        <a-plane id="target-area" color="#00ff00" position="0.2 -0.2 0" width="0.4" height="0.5" opacity="0.5"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      let isPlaying = false, score = 0, health = 100, enemies = [];
      let spawnIntervalId = null;
      
      const sceneEl = document.querySelector('a-scene');
      const cameraEl = document.querySelector('#camera');
      const targetAnchor = document.querySelector('#target-anchor');

      // פונקציה ליצירת אפקט פיצוץ
      function createExplosion(pos) {
        const explosion = document.createElement('a-sphere');
        explosion.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
        explosion.setAttribute('radius', '0.05');
        explosion.setAttribute('color', '#ff5500'); 
        explosion.setAttribute('material', 'transparent: true; opacity: 1');
        
        explosion.setAttribute('animation__scale', 'property: scale; to: 5 5 5; dur: 400; easing: easeOutQuad');
        explosion.setAttribute('animation__fade', 'property: material.opacity; to: 0; dur: 400; easing: easeOutQuad');
        
        targetAnchor.appendChild(explosion);
        
        setTimeout(() => {
          if (explosion.parentNode) {
            explosion.remove();
          }
        }, 400);
      }

      // פונקציה לביצוע יריית הלייזר
      function shootLaser() {
        const startPoint = new THREE.Vector3(0.2, 0.05, 0);
        
        const cameraWorld = new THREE.Vector3();
        cameraEl.object3D.getWorldPosition(cameraWorld);
        
        const endPoint = cameraWorld.clone();
        targetAnchor.object3D.worldToLocal(endPoint);
        
        const laser = document.createElement('a-entity');
        laser.setAttribute('line', `start: ${startPoint.x} ${startPoint.y} ${startPoint.z}; end: ${endPoint.x} ${endPoint.y} ${endPoint.z}; color: #ff0000; opacity: 1;`);
        
        targetAnchor.appendChild(laser);
        
        setTimeout(() => {
          if (laser.parentNode) {
            laser.remove();
          }
        }, 150);
      }

      function spawnEnemy() {
        if(!isPlaying) return;
        
        const enemy = document.createElement('a-box');
        const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffaa44', '#aa44ff'];
        enemy.setAttribute('color', colors[Math.floor(Math.random() * colors.length)]);
        // הקטנת הקוביות לגודל 0.06
        enemy.setAttribute('scale', '0.06 0.06 0.06');
        // שימוש ברכיב המיוחד שיצרנו למעלה כדי לצייר רק קווי מתאר חיצוניים
        enemy.setAttribute('draw-edges', '');

        const startX = (Math.random() - 0.5) * 1.5;
        const startY = (Math.random() - 0.5) * 1.5;
        const startZ = 1.5; 
        enemy.setAttribute('position', `${startX} ${startY} ${startZ}`);
        
        const targetX = Math.random() * 0.4;
        const targetY = (Math.random() * 0.5) - 0.45;
        const targetZ = 0;
        const enemyTargetPos = new THREE.Vector3(targetX, targetY, targetZ);
        
        const pathLine = document.createElement('a-entity');
        pathLine.setAttribute('line', `start: ${startX} ${startY} ${startZ}; end: ${targetX} ${targetY} ${targetZ}; color: yellow; opacity: 0.6`);
        
        targetAnchor.appendChild(pathLine);
        targetAnchor.appendChild(enemy); 
        
        enemies.push({ box: enemy, line: pathLine, targetPos: enemyTargetPos });
      }

      // מערכת כיוון ופגיעה (Screen-space targeting)
      window.addEventListener('click', (e) => {
        if(!isPlaying || e.target.tagName === 'BUTTON') return;
        
        shootLaser();

        const camera = cameraEl.getObject3D('camera');
        const vector = new THREE.Vector3();
        
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemyData = enemies[i];
          vector.setFromMatrixPosition(enemyData.box.object3D.matrixWorld);
          vector.project(camera);
          
          if (Math.sqrt(vector.x * vector.x + vector.y * vector.y) < 0.25) {
            enemyData.box.remove();
            enemyData.line.remove();
            enemies.splice(i, 1);
            score += 10;
            document.getElementById('score-val').innerText = score;
          }
        }
      });

      // לולאת משחק מרכזית
      function gameLoop() {
        if (!isPlaying) return;
        
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemyData = enemies[i];
          const enemyPos = enemyData.box.object3D.position;
          
          if (enemyPos.distanceTo(enemyData.targetPos) < 0.1) {
             health -= 10;
             document.getElementById('health-val').innerText = health;
             
             createExplosion(enemyPos);

             enemyData.box.remove();
             enemyData.line.remove();
             enemies.splice(i, 1);
             
             if(health <= 0) {
               isPlaying = false;
               clearInterval(spawnIntervalId);
               
               document.getElementById('final-score').innerText = score;
               document.getElementById('ui-container').classList.add('hidden');
               document.getElementById('game-over-screen').classList.remove('hidden');
             }
             continue;
          }
          
          const dir = new THREE.Vector3().subVectors(enemyData.targetPos, enemyPos).normalize();
          enemyData.box.object3D.position.add(dir.multiplyScalar(0.01));
        }
        
        requestAnimationFrame(gameLoop);
      }

      document.getElementById('start-btn').addEventListener('click', async () => {
        await sceneEl.systems["mindar-image-system"].start();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('ui-container').classList.remove('hidden');
        isPlaying = true;
        gameLoop();
        spawnIntervalId = setInterval(spawnEnemy, 1500);
      });

      document.getElementById('restart-btn').addEventListener('click', () => {
        score = 0;
        health = 100;
        document.getElementById('score-val').innerText = score;
        document.getElementById('health-val').innerText = health;
        
        enemies.forEach(e => {
          if (e.box.parentNode) e.box.remove();
          if (e.line.parentNode) e.line.remove();
        });
        enemies = [];
        
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('ui-container').classList.remove('hidden');
        
        isPlaying = true;
        gameLoop();
        spawnIntervalId = setInterval(spawnEnemy, 1500);
      });
    </script>
  </body>
</html>
